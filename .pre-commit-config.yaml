# Install once with:  pip install pre-commit && pre-commit install
#
# nbstripout is the important one. Committed notebook outputs are what took the
# original Part3.ipynb to 1.7 MB, of which 1.58 MB was a single cell.
repos:
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-merge-conflict
