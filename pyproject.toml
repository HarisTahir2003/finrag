[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finrag"
version = "0.3.0"
description = "Agentic retrieval-augmented generation over SEC 10-K filings"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Haris Tahir Rana" }]

# Kept deliberately small. Everything needed to ingest filings, build an index
# with local embeddings, and run the test suite -- no API key required.
dependencies = [
    "beautifulsoup4>=4.12.3",
    "lxml>=5.1.0",
    "sec-edgar-downloader>=5.0.0",
    "langchain-core>=0.3",
    # SQLiteCache for LLM response caching -- what makes evaluation re-runs
    # free on rate-limited tiers.
    # Upper bound is load-bearing, not caution. 0.4 dropped
    # `chat_models.vertexai`, which ragas still imports unconditionally at
    # package import time -- so with 0.4 installed, `finrag eval ragas` dies on
    # a ModuleNotFoundError for a backend nobody asked for. We use this package
    # only for SQLiteCache, so the older line costs us nothing.
    "langchain-community>=0.3,<0.4",
    # Lexical scoring for the hybrid retriever. A base dependency rather than
    # an extra because hybrid is the default: behind an extra, the default
    # retrieval mode would silently differ between two correct installs.
    "rank_bm25>=0.2.2",
    "langchain-text-splitters>=0.2.0",
    "langchain-chroma>=0.1.2",
    "chromadb>=0.5",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Local embeddings: no API key, no per-call cost. The CI default.
local = ["sentence-transformers>=3.0.0", "langchain-huggingface>=0.1.0"]
# Google embeddings + Gemini for the agent.
anthropic = ["langchain-anthropic>=0.3", "langchain-classic>=1.0.0"]
google = ["langchain-google-genai>=2.0.0", "langchain-classic>=1.0.0"]
# Open-weight models on Groq's free developer tier.
groq = ["langchain-groq>=0.2", "langchain-classic>=1.0.0"]
# Open-weight models running locally. No key, no rate limit, no cost.
ollama = ["langchain-ollama>=0.2", "langchain-classic>=1.0.0"]
# Gemini via Google Cloud Vertex AI -- the path that can spend Google Cloud
# promotional credits, which the AI Studio API cannot on a prepay account.
vertex = ["langchain-google-vertexai>=2.0.0", "langchain-classic>=1.0.0"]
# One client for every OpenAI-compatible endpoint: Cerebras, OpenRouter,
# Together, Fireworks, DeepInfra, OpenAI, or a self-hosted vLLM server.
openai-compatible = ["langchain-openai>=0.2", "langchain-classic>=1.0.0"]
# Structure-aware chunking. Plain `unstructured`: the `html` extra was folded
# into the base package, so asking for it now only earns a pip warning.
semantic = ["unstructured>=0.18.0"]
app = ["streamlit>=1.40.0"]
# Scoring with an LLM judge, plus experiment tracking.
#
# Both floors here are load-bearing. Below 0.4, ragas imports
# `langchain_community.chat_models.vertexai` -- a module that no longer
# exists -- so a resolver free to walk "ragas>=0.2" down to 0.3.1 produces an
# install that passes `pip check` and then dies the first time the judge
# runs. The openai floor guards the same failure from the other side: ragas
# pulls `instructor`, which will happily drag the OpenAI client back to the
# 1.x line and take langchain-openai with it, breaking every
# OpenAI-compatible backend (Cerebras, GitHub Models, OpenRouter) to satisfy
# the judge.
eval = ["ragas>=0.4", "datasets>=2.20.0", "mlflow>=2.16", "openai>=2.45"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
finrag = "finrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"finrag.eval" = ["datasets/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
