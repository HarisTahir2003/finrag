name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lint and unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # No API keys and no calls to model providers: the suite runs on committed
      # fixtures, so it works on a fork and on a fresh clone.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # api and app so the HTTP and Streamlit tests actually run rather
          # than importorskip past themselves -- both surfaces were previously
          # uncovered by CI entirely.
          pip install -e ".[dev,api,app]"

      - name: Lint
        run: ruff check src tests app.py

      - name: Format check
        run: ruff format --check src tests app.py

      - name: Test
        env:
          FINRAG_CHUNK_STRATEGY: recursive
        run: pytest --cov=finrag --cov-report=term-missing

  quality-gate:
    name: retrieval quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Local embeddings, so the gate needs no credentials and costs nothing.
      # A gate that required a paid judge model would be a gate nobody could run.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,local]"

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('pyproject.toml') }}

      # Structural validation of the evaluation cases themselves. The corpus
      # tier needs the downloaded filings and cannot run here, but the
      # structural tier catches duplicate ids, tickers that are never
      # downloaded, and -- the one that matters -- expected_tools naming a tool
      # the agent does not register, which fails a case on every run for a
      # reason no metric explains. validate_all degrades to structural on its
      # own when there is no index, so this needs no special flag.
      - name: Dataset validation
        run: finrag eval datasets --gate

      # Indexes the committed fixtures into a throwaway store, runs the labelled
      # retrieval probes, and fails the build if hit rate, MRR or filter accuracy
      # regress. filter_accuracy below 1.0 means chunks from the wrong company or
      # fiscal year came back -- the bug this project started with.
      - name: Retrieval gate
        env:
          FINRAG_CHUNK_STRATEGY: recursive
        run: finrag eval retrieval --fixtures --gate

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: results/
          if-no-files-found: ignore

  llm-smoke:
    name: agent smoke test (Groq)
    runs-on: ubuntu-latest
    # An LLM's output is not deterministic and a free tier can be exhausted, so
    # this job reports rather than blocks. The deterministic retrieval gate
    # above stays the required check.
    continue-on-error: true
    permissions:
      contents: read
    # This used to run on GitHub Models, whose built-in GITHUB_TOKEN needed no
    # repository secret and worked on forks too. GitHub retired that service on
    # 30 July 2026, so the job now needs a GROQ_API_KEY secret and skips
    # cleanly without one -- which is what forks and fresh clones will see.
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,local,groq]"

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('pyproject.toml') }}

      # Three fixture-answerable questions through the real tool-calling agent.
      # Groq's free tier meters 8,000 tokens per minute, and an agent resends
      # its scratchpad at every step, so the context trimmer
      # (FINRAG_MAX_CONTEXT_TOKENS=auto) is what keeps a three-case run inside
      # one minute's budget.
      - name: Agent smoke suite
        if: env.GROQ_API_KEY != ''
        env:
          FINRAG_LLM_BACKEND: groq
          FINRAG_CHUNK_STRATEGY: recursive
          FINRAG_RETRIEVAL_K: "6"
        run: finrag eval agent --fixtures --dataset smoke

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-smoke-results
          path: results/
          if-no-files-found: ignore
