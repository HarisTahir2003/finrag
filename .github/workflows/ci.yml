name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lint and unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # No API keys and no calls to model providers: the suite runs on committed
      # fixtures, so it works on a fork and on a fresh clone.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # api and app so the HTTP and Streamlit tests actually run rather
          # than importorskip past themselves -- both surfaces were previously
          # uncovered by CI entirely.
          pip install -e ".[dev,api,app]"

      - name: Lint
        run: ruff check src tests app.py deploy

      - name: Format check
        run: ruff format --check src tests app.py deploy

      - name: Test
        env:
          FINRAG_CHUNK_STRATEGY: recursive
        run: pytest --cov=finrag --cov-report=term-missing

  quality-gate:
    name: retrieval quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Local embeddings, so the gate needs no credentials and costs nothing.
      # A gate that required a paid judge model would be a gate nobody could run.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,local]"

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('pyproject.toml') }}

      # Structural validation of the evaluation cases themselves. The corpus
      # tier needs the downloaded filings and cannot run here, but the
      # structural tier catches duplicate ids, tickers that are never
      # downloaded, and -- the one that matters -- expected_tools naming a tool
      # the agent does not register, which fails a case on every run for a
      # reason no metric explains. validate_all degrades to structural on its
      # own when there is no index, so this needs no special flag.
      - name: Dataset validation
        run: finrag eval datasets --gate

      # Indexes the committed fixtures into a throwaway store, runs the labelled
      # retrieval probes, and fails the build if hit rate, MRR or filter accuracy
      # regress. filter_accuracy below 1.0 means chunks from the wrong company or
      # fiscal year came back -- the bug this project started with.
      - name: Retrieval gate
        env:
          FINRAG_CHUNK_STRATEGY: recursive
        run: finrag eval retrieval --fixtures --gate

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: results/
          if-no-files-found: ignore

  llm-smoke:
    name: agent smoke test (Groq)
    runs-on: ubuntu-latest
    # An LLM's output is not deterministic and a free tier can be exhausted, so
    # this job reports rather than blocks. The deterministic retrieval gate
    # above stays the required check.
    continue-on-error: true
    permissions:
      contents: read
    # This used to run on GitHub Models, whose built-in GITHUB_TOKEN needed no
    # repository secret and worked on forks too. GitHub retired that service on
    # 30 July 2026, so the job now needs a GROQ_API_KEY secret and skips
    # cleanly without one -- which is what forks and fresh clones will see.
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,local,groq]"

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('pyproject.toml') }}

      # Three fixture-answerable questions through the real tool-calling agent.
      # Groq's free tier meters 8,000 tokens per minute, and an agent resends
      # its scratchpad at every step, so the context trimmer
      # (FINRAG_MAX_CONTEXT_TOKENS=auto) is what keeps a three-case run inside
      # one minute's budget.
      - name: Agent smoke suite
        if: env.GROQ_API_KEY != ''
        env:
          FINRAG_LLM_BACKEND: groq
          FINRAG_CHUNK_STRATEGY: recursive
          FINRAG_RETRIEVAL_K: "6"
        run: finrag eval agent --fixtures --dataset smoke

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-smoke-results
          path: results/
          if-no-files-found: ignore

  deploy-install:
    name: hosted install path
    runs-on: ubuntu-latest

    # The deployment does not use pyproject.toml. Streamlit Community Cloud
    # installs requirements.txt on a Linux box with Python 3.12 and runs
    # app.py, and nothing here checked that path -- so the file that decides
    # whether the public demo builds was the one file CI never exercised.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('pyproject.toml') }}

      - name: Install exactly what the host installs
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The single most expensive way this can go wrong, and it is silent:
      # a plain `torch` requirement resolves to the CUDA build on Linux, which
      # is 527MB plus fifteen nvidia-* packages. It still *works*; it just does
      # not fit on a host with a 690MB memory ceiling, and you find out at
      # deploy time.
      - name: No CUDA packages
        run: |
          cuda=$(pip list --format=freeze | grep -Ei '^(nvidia-|triton=)' || true)
          if [ -n "$cuda" ]; then
            echo "requirements.txt pulled CUDA packages onto a CPU-only deployment:"
            echo "$cuda"
            exit 1
          fi
          python -c "import torch; assert '+cpu' in torch.__version__, torch.__version__; print(torch.__version__)"

      # Importing the app is the real check: it exercises the sys.path shim
      # that makes `finrag` importable without the package being installed,
      # which is the part that only matters on a host and therefore the part
      # most likely to rot.
      - name: The app imports and the index unpacks
        env:
          FINRAG_LLM_BACKEND: groq
          GROQ_API_KEY: not-a-real-key
        run: |
          python - <<'PY'
          import pathlib, sys
          sys.path.insert(0, "src")
          from finrag.bootstrap import ensure_index
          from finrag.config import get_settings
          from finrag.ingest.index import index_status

          settings = get_settings()
          unpacked = ensure_index(settings)
          ready, size, reason = index_status(settings)
          print(f"unpacked={unpacked} ready={ready} chunks={size} ({reason})")
          assert ready and size > 0, f"the shipped archive did not produce an index: {reason}"
          PY

      - name: Streamlit can load the entrypoint
        run: |
          python -c "
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file('app.py', default_timeout=180)
          at.run()
          assert not at.exception, at.exception
          print('app booted')
          "

  images:
    name: container images build
    runs-on: ubuntu-latest
    # Only on main and on demand: each image installs torch and bakes two
    # models, which is minutes of runner time that a docs typo does not need.
    if: github.event_name != 'pull_request'

    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            name: local stack
          - dockerfile: Dockerfile.space
            name: single-container demo

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built but not pushed. The point is that the Dockerfiles still describe
      # something buildable -- both have broken before in ways nothing else
      # would have caught, and neither is exercised by the test suite.
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.dockerfile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dockerfile }}
