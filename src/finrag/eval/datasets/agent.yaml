# The 20-question agent suite, carried over from the original notebook cell.
#
# Scoring needs an LLM, so this does not run in CI -- the retrieval dataset is
# the gate. Run it with: finrag eval agent
#
# Years are FISCAL years. That mattered: the original run scored 60% functional
# tool-call accuracy against a corpus where six of these ten tickers were indexed
# under the wrong year, so the questions and the index disagreed.

dataset: sec-10k-agent
description: End-to-end questions over ten large-cap 10-K filings.

cases:
  - id: calc-aapl-2023-01
    category: calc
    ticker: AAPL
    fiscal_year: 2023
    question: "What is the current ratio for Apple in 2023?"
    expected_tools: [search_10k_reports, calculator]
    reference_answer: "0.988 (current assets $143,566M / current liabilities $145,308M)"

  - id: calc-amzn-2022-02
    category: calc
    ticker: AMZN
    fiscal_year: 2022
    question: "Calculate the net profit margin for Amazon in 2022."
    expected_tools: [search_10k_reports, calculator]
    reference_answer: "-0.53% (net loss $2,722M / net sales $513,983M)"
    note: "Under the old accession-number indexing this filing was labelled 2023, so a query for 2022 retrieved the wrong year entirely."

  - id: calc-tsla-2023-03
    category: calc
    ticker: TSLA
    fiscal_year: 2023
    question: "What was the year-over-year growth in Tesla's total assets between 2022 and 2023?"
    expected_tools: [search_10k_reports, calculator]
    reference_answer: "29.49% (2023 $106,618M vs 2022 $82,338M)"
    note: "Requires two filings, so it exercises year filtering twice."

  - id: calc-msft-2023-04
    category: calc
    ticker: MSFT
    fiscal_year: 2023
    question: "Calculate the debt-to-equity ratio for Microsoft for 2023."
    expected_tools: [search_10k_reports, calculator]
    reference_answer: "0.229 (total debt $47,237M / total equity $206,223M)"
    derived_figures: ["47,237"]
    note: >
      Total debt is the sum of two stated balance-sheet lines -- current portion
      of long-term debt 5,247 plus long-term debt 41,990 -- so it appears nowhere
      verbatim. The reference previously read 47,193, which is simply wrong; the
      ratio rounds to 0.229 either way, which is why it went unnoticed until the
      dataset validator asked where the figure came from.

  - id: calc-nvda-2024-05
    category: calc
    ticker: NVDA
    fiscal_year: 2024
    question: "What is the inventory turnover for Nvidia in fiscal 2024?"
    expected_tools: [search_10k_reports, calculator]
    reference_answer: "3.18x (COGS $16,621M / average inventory $5,221M)"
    derived_figures: ["5,221"]
    note: >
      NVIDIA's fiscal 2024 ended in January 2024. Average inventory is
      (5,282 + 5,159) / 2 = 5,220.5, so it is computed rather than reported and
      appears in no chunk of the filing.

  - id: narrative-meta-2023-06
    category: narrative
    ticker: META
    fiscal_year: 2023
    question: "What does management identify as the primary risk regarding competition in 2023?"
    expected_tools: [search_10k_reports]
    reference_answer: "Intense competition from short-form video platforms, alternative social networks, and shifts in Family of Apps engagement."

  - id: narrative-googl-2022-07
    category: narrative
    ticker: GOOGL
    fiscal_year: 2022
    question: "Explain Google's strategy for AI investment as described in the 2022 MD&A."
    expected_tools: [search_10k_reports]
    reference_answer: "An AI-first focus, integrating generative AI into Search and Cloud and investing in DeepMind and high-performance compute infrastructure."

  - id: narrative-nflx-2023-08
    category: narrative
    ticker: NFLX
    fiscal_year: 2023
    question: "What reasons does Netflix give for the change in its content spending strategy in 2023?"
    expected_tools: [search_10k_reports]
    reference_answer: "A focus on profitability and quality over quantity, compounded by production delays from industry strikes."

  - id: narrative-v-2023-09
    category: narrative
    ticker: V
    fiscal_year: 2023
    question: "How does Visa describe the impact of cross-border travel recovery on its revenue?"
    expected_tools: [search_10k_reports]
    reference_answer: "Cross-border volume rose 22%, driving 29% growth in international transaction revenues as travel restrictions eased."

  - id: narrative-jpm-2023-10
    category: narrative
    ticker: JPM
    fiscal_year: 2023
    question: "What are the key cybersecurity risks highlighted by JP Morgan in 2023?"
    expected_tools: [search_10k_reports]
    reference_answer: "AI-driven phishing, ransomware extortion, and vulnerabilities in third-party software supply chains."

  - id: mixed-aapl-2023-11
    category: mixed
    ticker: AAPL
    fiscal_year: 2023
    question: "Did Apple's R&D as a percentage of sales increase in 2023, and what drove that change?"
    expected_tools: [search_10k_reports, calculator]
    reference_answer: "Yes, to 7.8% from 6.7%, driven by headcount-related expenses and product development engineering costs."

  - id: mixed-amzn-2023-12
    category: mixed
    ticker: AMZN
    fiscal_year: 2023
    question: "Calculate return on assets for 2023 and explain management's view on asset utilisation efficiency."
    expected_tools: [search_10k_reports, calculator]
    reference_answer: "ROA about 6.12%. Management prioritised regionalisation of the fulfilment network to cut transport distances and improve unit efficiency."

  - id: mixed-tsla-2022-13
    category: mixed
    ticker: TSLA
    fiscal_year: 2022
    question: "What was Tesla's gross margin in 2022, and what specific headwinds affected it?"
    expected_tools: [search_10k_reports, calculator]
    reference_answer: "25.6%. Headwinds included lithium prices, raw material inflation, and ramping the Berlin and Austin factories."

  - id: mixed-nvda-2024-14
    category: mixed
    ticker: NVDA
    fiscal_year: 2024
    question: "Analyse the change in NVIDIA's cash position from fiscal 2023 to 2024 and why it increased."
    expected_tools: [search_10k_reports, calculator]
    reference_answer: "Cash and equivalents grew about $12.6B to $25.9B, driven by record Data Center revenue."

  - id: mixed-meta-2023-15
    category: mixed
    ticker: META
    fiscal_year: 2023
    question: "What was Meta's operating margin in 2023, and what cost reduction measures does management describe?"
    expected_tools: [search_10k_reports, calculator]
    reference_answer: "34.7% (income from operations $46,753M / total revenue $134,902M), achieved alongside cost reductions from scaling back budgets, shrinking the real estate footprint, and layoffs and restructurings."
    note: >
      Replaces a question about the "Year of Efficiency" and the "Family of Apps
      operating margin". Neither phrase appears anywhere in META's FY2023 10-K --
      both were earnings-call framing -- so the case asserted a premise the
      corpus contradicts and could not be answered from the filing at any
      retrieval depth. The replacement is grounded: both figures are stated in
      the income statement, the margin itself is not reported anywhere (the only
      "operating margin" in the document is risk-factor boilerplate), and the
      cost reductions are described in management's own words. So it still needs
      retrieval and arithmetic, which is what a mixed case is for.

  - id: mixed-msft-2023-16
    category: mixed
    ticker: MSFT
    fiscal_year: 2023
    question: "What is the cloud revenue growth rate for 2023, and how does management explain Azure demand?"
    expected_tools: [search_10k_reports]
    reference_answer: "22% growth to about $111B, attributed to a structural shift as customers migrated workloads to AI-optimised infrastructure."
    note: >
      The calculator was expected here and should not have been. The filing
      states the answer outright -- "Microsoft Cloud revenue increased 22% to
      $111.6 billion" -- so retrieving it is the correct behaviour, and the
      agent was marked failed for doing exactly the right thing. Demanding
      arithmetic for a figure the source reports is a defect in the case, not a
      gap in the agent.

  - id: mixed-nflx-2022-17
    category: mixed
    ticker: NFLX
    fiscal_year: 2022
    question: "Calculate free cash flow for 2022 and explain why it differed from net income."
    expected_tools: [search_10k_reports, calculator]
    reference_answer: "FCF about $1.6B against net income of $4.5B; the gap is non-cash amortisation of content assets versus cash spent on production."

  - id: mixed-googl-2023-18
    category: mixed
    ticker: GOOGL
    fiscal_year: 2023
    question: "What was the effective tax rate in 2023, and what discrete tax items influenced it?"
    expected_tools: [search_10k_reports, calculator]
    reference_answer: "About 14%, down from 16%, influenced by a $1.2B discrete benefit from a valuation allowance reversal and geographic income mix."

  - id: mixed-v-2022-19
    category: mixed
    ticker: V
    fiscal_year: 2022
    question: "Calculate the dividend payout ratio and explain Visa's capital return philosophy."
    expected_tools: [search_10k_reports, calculator]
    reference_answer: "About 23%. Organic growth and acquisitions first, then consistent dividend growth and opportunistic buybacks."

  - id: mixed-jpm-2022-20
    category: mixed
    ticker: JPM
    fiscal_year: 2022
    question: "What was the CET1 capital ratio in 2022, and how did the First Republic acquisition affect the outlook?"
    expected_tools: [search_10k_reports]
    reference_answer: "CET1 was 13.2%. The 2022 report does not mention First Republic, which was acquired in May 2023."
    note: "A trap: a correct answer must say the 2022 filing cannot discuss a 2023 event. Tests year-filtering discipline."
