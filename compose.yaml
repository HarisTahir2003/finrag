# Two services from one image: the HTTP API and the Streamlit UI.
#
#   docker compose up --build
#
# The index is mounted rather than baked. It is 134MB that changes whenever the
# corpus is re-indexed, and rebuilding an image to pick up new filings is the
# wrong shape for local work. A deployed image bakes it instead -- see Phase 4.

services:
  api:
    build: .
    image: finrag:latest
    ports:
      - "${FINRAG_API_PORT:-8000}:8000"
    volumes:
      # Mounted read-write, though read-only would be nicer. SQLite creates
      # -wal and -shm beside the database even to read it, and Chroma opens it
      # read-write regardless, so a read-only mount dies at startup with
      # "attempt to write a readonly database". Chroma's constraint, not a
      # decision.
      - ./data:/app/data
    environment:
      FINRAG_DATA_ROOT: /app/data
      # Passed through from the host so no key is ever written into the image.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      FINRAG_LLM_BACKEND: ${FINRAG_LLM_BACKEND:-groq}
      FINRAG_RETRIEVAL_K: ${FINRAG_RETRIEVAL_K:-20}
    restart: unless-stopped

  # Independent of the API today: the UI talks to the agent directly, so it
  # is deliberately not made to wait on the API's health. Wiring the two
  # together is a Phase 4 decision, not an accident of compose.
  ui:
    build: .
    image: finrag:latest
    ports:
      - "${FINRAG_UI_PORT:-8501}:8501"
    volumes:
      - ./data:/app/data
    environment:
      FINRAG_DATA_ROOT: /app/data
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      FINRAG_LLM_BACKEND: ${FINRAG_LLM_BACKEND:-groq}
      FINRAG_RETRIEVAL_K: ${FINRAG_RETRIEVAL_K:-20}
    # The image's HEALTHCHECK probes the API on port 8000, which this container
    # does not run. Inherited unchanged it reports the UI unhealthy forever.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    command:
      - streamlit
      - run
      - app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
      # Nothing in an image changes at runtime, so watching for edits is wasted
      # work -- and not harmless: the watcher walks every loaded module, which
      # drags transformers' lazy imports into pulling image processors that
      # want torchvision. The image installs CPU torch only, so that raises,
      # Streamlit catches it, and the log fills with a traceback from a feature
      # nothing here uses.
      - --server.fileWatcherType=none
    restart: unless-stopped
